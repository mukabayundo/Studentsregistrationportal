<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Event Dashboard</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

  <!-- NAVBAR -->
  <nav class="bg-white shadow sticky top-0 z-50">

    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">

      <h1 class="text-2xl font-bold">
        EduEvents
      </h1>

      <input
        type="text"
        id="searchInput"
        placeholder="Search events..."
        class="border border-gray-300 rounded-lg px-4 py-2 outline-none focus:border-blue-500 md:w-64 w-full ml-4"
      >

    </div>

  </nav>



  <!-- HERO SECTION -->
  <section class="bg-gradient-to-r from-blue-500 to-purple-600 text-white py-20 text-center">

    <h2 class="text-4xl md:text-5xl font-bold mb-4">
      Student Event Registration
    </h2>

    <p class="max-w-2xl mx-auto text-lg">
      Register for school events, manage seats, and track participation easily.
    </p>

  </section>



  <!-- STATISTICS -->
  <section class="max-w-6xl mx-auto px-6 py-10">

    <div class="grid grid-cols-1 md:grid-cols-3 gap-5">

      <div class="bg-white rounded-xl shadow p-6 text-center">
        <h3 class="text-gray-500 mb-2">
          Total Events
        </h3>

        <p
          id="totalEvents"
          class="text-4xl font-bold"
        >
          0
        </p>
      </div>



      <div class="bg-white rounded-xl shadow p-6 text-center">
        <h3 class="text-gray-500 mb-2">
          Registered Students
        </h3>

        <p
          id="totalRegistered"
          class="text-4xl font-bold text-blue-500"
        >
          0
        </p>
      </div>



      <div class="bg-white rounded-xl shadow p-6 text-center">
        <h3 class="text-gray-500 mb-2">
          Remaining Seats
        </h3>

        <p
          id="remainingSeats"
          class="text-4xl font-bold text-green-500"
        >
          0
        </p>
      </div>

    </div>

  </section>



  <!-- EVENTS -->
  <section class="max-w-6xl mx-auto px-6 pb-10">

    <div class="flex justify-between items-center mb-6">

      <h2 class="text-3xl font-bold">
        Available Events
      </h2>

    </div>



    <div
      id="eventsContainer"
      class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"
    >
    </div>

  </section>



  <!-- ADD EVENT FORM -->
  <section class="max-w-4xl mx-auto px-6 pb-20">

    <div class="bg-white rounded-xl shadow p-8">

      <h2 class="text-3xl font-bold mb-6">
        Add New Event
      </h2>



      <form id="eventForm" class="space-y-5">

        <!-- TITLE -->
        <div>

          <label class="block mb-2 font-semibold">
            Event Title
          </label>

          <input
            type="text"
            id="title"
            class="w-full border border-gray-300 rounded-lg px-4 py-3 outline-none focus:border-blue-500"
            placeholder="Enter event title"
          >

        </div>



        <!-- CATEGORY -->
        <div>

          <label class="block mb-2 font-semibold">
            Category
          </label>

          <select
            id="category"
            class="w-full border border-gray-300 rounded-lg px-4 py-3 outline-none focus:border-blue-500"
          >

            <option value="">Select category</option>
            <option>Technology</option>
            <option>Science</option>
            <option>Sports</option>
            <option>Arts</option>
            <option>Business</option>

          </select>

        </div>



        <!-- SEATS -->
        <div>

          <label class="block mb-2 font-semibold">
            Number of Seats
          </label>

          <input
            type="number"
            id="seats"
            class="w-full border border-gray-300 rounded-lg px-4 py-3 outline-none focus:border-blue-500"
            placeholder="Enter number of seats"
          >

        </div>



        <!-- BUTTON -->
        <button
          type="submit"
          class="bg-black text-white px-6 py-3 rounded-lg hover:bg-blue-500 transition"
        >
          Add Event
        </button>

      </form>

    </div>

  </section>



  <script src="Student.js"></script>

</body>
</html>
